name: Deploy to Azure Container Apps

# Builds the image and deploys the Bicep template to Azure Container Apps.
# Authenticates to Azure with OIDC (federated credentials) so no long-lived
# cloud secrets are stored in GitHub. The image is built on the runner and
# pushed to the registry with `docker push` (the deploy identity needs AcrPush).
#
# The deployment runs the server in OAuth (Entra ID) mode, so MCP clients sign
# in via the browser (no pre-supplied token). This requires an Entra app
# registration whose redirect URI is "https://<app-fqdn>/auth/callback" with
# admin consent for Azure DevOps. See deploy/azure/README.md.
#
# Required configuration (Settings -> Secrets and variables -> Actions):
#   Secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#              ENTRA_CLIENT_SECRET
#   Variables: AZURE_RESOURCE_GROUP, ACR_NAME, ACR_RESOURCE_GROUP,
#              CONTAINER_APP_NAME, ADO_ORG, ENTRA_TENANT_ID, ENTRA_CLIENT_ID,
#              OAUTH_STATE_STORAGE_ACCOUNT (storage account holding the OAuth
#              server state; unset = state kept in memory and lost on restart)
#   Optional:  ALERT_EMAIL (variable) - email for the 401/403 spike alert;
#              unset = no alert resources are created.
# See deploy/azure/README.md ("CI/CD") for one-time setup.

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: "Image tag to build and deploy (defaults to the commit SHA)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-aca.yml"

# OIDC login needs id-token: write; contents: read to checkout.
permissions:
  contents: read
  id-token: write

# Run JavaScript actions on Node.js 24. The actions pinned below ship on
# Node.js 20, which GitHub is deprecating; this opts them into the Node.js 24
# runtime without changing the pinned SHAs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Never run two deploys against the same environment at once.
concurrency:
  group: deploy-aca
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Tie to a GitHub Environment so you can require manual approval for prod.
    environment: production

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.imageTag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::12}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        id: build
        run: |
          set -euo pipefail
          ACR_SERVER="${{ vars.ACR_NAME }}.azurecr.io"
          IMAGE="$ACR_SERVER/${{ vars.CONTAINER_APP_NAME }}:${{ steps.meta.outputs.tag }}"
          az acr login -n "${{ vars.ACR_NAME }}"
          docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t "$IMAGE" -f Dockerfile .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep to Azure Container Apps
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME="deploy-${{ steps.meta.outputs.tag }}"
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$DEPLOYMENT_NAME" \
            --template-file deploy/azure/main.bicep \
            --parameters \
              appName="${{ vars.CONTAINER_APP_NAME }}" \
              adoOrg="${{ vars.ADO_ORG }}" \
              acrName="${{ vars.ACR_NAME }}" \
              acrResourceGroup="${{ vars.ACR_RESOURCE_GROUP }}" \
              assignAcrPullRole=false \
              containerImage="${{ steps.build.outputs.image }}" \
              alertEmail="${{ vars.ALERT_EMAIL }}" \
              authMode=oauth \
              entraTenantId="${{ vars.ENTRA_TENANT_ID }}" \
              entraClientId="${{ vars.ENTRA_CLIENT_ID }}" \
              entraClientSecret="${{ secrets.ENTRA_CLIENT_SECRET }}" \
              oauthStateStorageAccountName="${{ vars.OAUTH_STATE_STORAGE_ACCOUNT }}" \
              assignTableRole=false

          MCP_URL=$(az deployment group show \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "$DEPLOYMENT_NAME" \
            --query properties.outputs.mcpUrl.value -o tsv)
          echo "**Deployed MCP endpoint:** $MCP_URL" >> "$GITHUB_STEP_SUMMARY"
