name: Build MCP Server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

# Run JavaScript actions on Node.js 24. The actions pinned below ship on
# Node.js 20, which GitHub is deprecating; this opts them into the Node.js 24
# runtime without changing the pinned SHAs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build the project
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove .npmrc - uses standard registry for internal build check - non-release version
        run: rm -f .npmrc

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Clean install dependencies
        run: npm ci --ignore-scripts

      - name: Build the project
        run: npm run build

      - name: Validate tool names and parameters
        # Types are already checked by "npm run build" above.
        run: node scripts/build-validate-tools.js

      - name: Cache jest transforms
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.cjs', 'tsconfig.jest.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.cjs', 'tsconfig.jest.json') }}-
            jest-${{ runner.os }}-

      - name: Run tests
        run: npm run test:ci

      # docs/TOOLSET.md is generated from the tools the built server registers.
      # A PR that adds, removes or changes a tool must regenerate it.
      - name: Verify docs/TOOLSET.md is up to date
        run: npm run toolset-check

      - name: Display coverage summary
        run: |
          echo "=== Code Coverage Summary ==="
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t = require("./coverage/coverage-summary.json").total; for (const k of ["lines", "functions", "branches", "statements"]) console.log(k + ": " + t[k].pct + "%");'
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: azure-devops-mcp-coverage
          fail_ci_if_error: false

      - name: Validate server startup via npx
        run: |
          result=$(npx mcp-server-azuredevops 2>&1) || true
          if ! grep -q "Usage: mcp-server-azuredevops <organization>" <<< "$result"; then
            echo "Expected usage message not found in output:"
            echo "$result"
            exit 1
          fi
          echo "Validation passed."

  static-code-analysis:
    name: Static code analysis
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Clean install dependencies
        run: npm ci --ignore-scripts

      # Regenerates src/version.ts (prebuild) for the version check below, and
      # produces dist/, which the tool-name ESLint rule imports its validator from.
      - name: Build the project
        run: npm run build

      - name: Static code analysis
        run: npm run eslint

      - name: Check code formatting
        run: npm run format-check

      - name: Verify package version is synced
        run: |
          git diff --exit-code ./src/version.ts || { echo "Version mismatch detected. Please ensure that the version information in version.ts is up to date with package.json."; exit 1; }
          git diff --exit-code ./package-lock.json || { echo "Please run 'npm install' to update package-lock.json and add changes to the commit."; exit 1; }
