name: Build MCP Server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

# Run JavaScript actions on Node.js 24. The actions pinned below ship on
# Node.js 20, which GitHub is deprecating; this opts them into the Node.js 24
# runtime without changing the pinned SHAs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build the project
    runs-on: windows-latest

    steps:
      - uses: step-security/harden-runner@6c439dc8bdf85cadbbce9ed30d1c7b959517bc49 # v2.12.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Remove .npmrc - uses standard registry for internal build check - non-release version
        run: |
          if (Test-Path .npmrc) {
            Remove-Item .npmrc
          }
        shell: pwsh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Clean install dependencies
        run: npm ci --ignore-scripts

      - name: Build the project
        run: npm run build

      - name: Validate tool names and parameters
        # Types are already checked by "npm run build" above.
        run: node scripts/build-validate-tools.js

      - name: Cache jest transforms
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.cjs', 'tsconfig.jest.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.cjs', 'tsconfig.jest.json') }}-
            jest-${{ runner.os }}-

      - name: Run tests
        run: npm run test:ci

      # docs/TOOLSET.md is generated from the tools the built server registers.
      # A PR that adds, removes or changes a tool must regenerate it.
      - name: Verify docs/TOOLSET.md is up to date
        # A dedicated script rather than `npm run toolset -- --check`: PowerShell on the
        # Windows runner can swallow the `--` when npm resolves to npm.ps1.
        run: npm run toolset-check

      - name: Display coverage summary
        run: |
          Write-Host "=== Code Coverage Summary ==="
          if (Test-Path "coverage/lcov-report/index.html") {
            Write-Host "Coverage report generated successfully"
            if (Test-Path "coverage/coverage-summary.json") {
              $coverage = Get-Content "coverage/coverage-summary.json" | ConvertFrom-Json
              $total = $coverage.total
              Write-Host "Lines: $($total.lines.pct)%"
              Write-Host "Functions: $($total.functions.pct)%"
              Write-Host "Branches: $($total.branches.pct)%"
              Write-Host "Statements: $($total.statements.pct)%"
            }
          }
        shell: pwsh

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: azure-devops-mcp-coverage
          fail_ci_if_error: false

      - name: Validate server startup via npx
        shell: pwsh
        run: |
          $result = & npx mcp-server-azuredevops 2>&1 | Out-String
          if ($result -notmatch "Usage: mcp-server-azuredevops <organization>") {
            Write-Host "Expected usage message not found in output:"
            Write-Host $result
            exit 1
          }
          Write-Host "Validation passed."
          exit 0

  static-code-analysis:
    name: Static code analysis
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@6c439dc8bdf85cadbbce9ed30d1c7b959517bc49 # v2.12.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Clean install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate src/version.ts
        run: npm run prebuild

      - name: Static code analysis
        run: npm run eslint

      - name: Check code formatting
        run: npm run format-check

      - name: Verify package version is synced
        run: |
          git diff --exit-code ./src/version.ts || { echo "Version mismatch detected. Please ensure that the version information in version.ts is up to date with package.json."; exit 1; }
          git diff --exit-code ./package-lock.json || { echo "Please run 'npm install' to update package-lock.json and add changes to the commit."; exit 1; }
