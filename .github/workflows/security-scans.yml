name: Security scans

# Supply-chain and configuration scanning for the repo, image, IaC, and
# workflows. Tools run from their official container images / az CLI so the
# workflow doesn't depend on pinning third-party marketplace action versions.
#
# The tool images are pulled with a short retry loop: pulling ":latest" from
# Docker Hub on hosted runners occasionally times out, which would otherwise
# fail the scan with a transient network error rather than a real finding.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# JS actions below still ship on Node.js 20; opt them into the Node.js 24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dependencies:
    name: Dependency vulnerabilities (Trivy)
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (vulnerabilities)
        run: |
          set -euo pipefail
          image="aquasec/trivy:latest"
          for attempt in 1 2 3; do
            docker pull "$image" && break
            echo "::warning::docker pull $image failed (attempt $attempt); retrying" && sleep $((attempt * 10))
          done
          docker run --rm -v "$PWD:/src" "$image" fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            /src

  dockerfile:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint
        run: |
          set -euo pipefail
          image="hadolint/hadolint:latest"
          for attempt in 1 2 3; do
            docker pull "$image" && break
            echo "::warning::docker pull $image failed (attempt $attempt); retrying" && sleep $((attempt * 10))
          done
          docker run --rm -i "$image" hadolint --failure-threshold error - < Dockerfile

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          set -euo pipefail
          image="rhysd/actionlint:latest"
          for attempt in 1 2 3; do
            docker pull "$image" && break
            echo "::warning::docker pull $image failed (attempt $attempt); retrying" && sleep $((attempt * 10))
          done
          docker run --rm -v "$PWD:/repo" -w /repo "$image" -color

  bicep:
    name: Bicep validate
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: az bicep build
        run: |
          az bicep install
          az bicep build --file deploy/azure/main.bicep
          az bicep build --file deploy/azure/acr-pull-role.bicep
