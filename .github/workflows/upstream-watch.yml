name: Upstream watch

# Keeps one issue listing the microsoft/azure-devops-mcp commits that
# docs/UPSTREAM-SYNC.md has not reviewed yet, so the fork never drifts silently
# again. The issue is refreshed weekly and closed once the marker catches up.
# With Issues disabled for the repository, the list goes to the run summary and
# a run with commits to review fails, so it still surfaces.
# Logic lives in scripts/upstream-watch.sh (run it locally with DRY_RUN=1).

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Report unreviewed upstream commits
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the upstream sync issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/upstream-watch.sh
